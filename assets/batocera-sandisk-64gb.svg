<linearGradient id="usb" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#4e4f54"/><stop offset=".4" stop-color="#11151d"/><stop offset="1" stop-color="#070a10"/></linearGradient>
<linearGradient id="red" x1="0" x2="1"><stop stop-color="#fd335d"/><stop offset="1" stop-color="#c90927"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
