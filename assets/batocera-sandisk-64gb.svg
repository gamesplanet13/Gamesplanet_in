<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">SanDisk 64GB USB 3.0 with Batocera Games</title><desc id="desc">Games Planet graphic showing one black and red SanDisk-style USB pendrive alongside a Batocera gaming screen and price ₹1,999. Illustrative artwork, not an actual product photograph.</desc>
<defs>
