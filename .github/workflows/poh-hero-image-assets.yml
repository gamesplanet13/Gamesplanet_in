name: Import approved Safar-e-Shahadat artwork
on:
  push:
    paths:
      - '.github/workflows/poh-hero-image-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize approved images
        env:
          HD_IMAGE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/b7c0c429-ddf7-465f-b684-9e2ea9929b1b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmY0N2MwMGM3NzA0NGVkZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTY5NTUwMH0.V-KfoKbgKW_LLh05nDwT2GMkOaoKrUW2xFEeHsBQDfo"
          BLUR_IMAGE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/dade83c2-1bc1-4569-b05b-c566569171c5.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzk1Y2NmNDM5MTQxNmUzOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTY3NDMwN30.TbfUQGL2xnqotfStsfDRkJHznghMffK0-Q6EPdTMuG4"
        run: |
          set -eu
          mkdir -p poh-samagam/assets
          curl --fail --location --retry 3 --max-time 60 "$HD_IMAGE_URL" -o /tmp/safare-hd.png
          curl --fail --location --retry 3 --max-time 60 "$BLUR_IMAGE_URL" -o /tmp/safare-blurred.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          for source,dest,width,quality in [
              ('/tmp/safare-hd.png','poh-samagam/assets/safare-hero-hd.webp',1600,88),
              ('/tmp/safare-blurred.png','poh-samagam/assets/safare-background.webp',1400,78),
          ]:
              image=Image.open(source).convert('RGB')
              image.thumbnail((width,1600))
              image.save(dest,'WEBP',quality=quality,method=6)
              print(dest,image.size)
          PY
      - name: Commit permanent website artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poh-samagam/assets/safare-hero-hd.webp poh-samagam/assets/safare-background.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved HD hero image and blurred page background"
            git pull --rebase
            git push
          fi
