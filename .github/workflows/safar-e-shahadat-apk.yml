name: Build Safar-e-Shahadat APK
on:
  push:
    branches: [main]
    paths:
      - 'safar-e-shahadat-2026-android/**'
      - '.github/workflows/safar-e-shahadat-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safar-e-shahadat-apk-release
  cancel-in-progress: false
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original signing certificate
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: safar-shahadat-android-debug-signing-2026-v1
      - name: Fail closed if original certificate is no longer available
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          if ls poh-samagam/apk/Safar-e-Shahadat-2026-*.apk >/dev/null 2>&1; then
            echo "::error::Signing cache expired. Refusing to publish an APK signed with a new key. Configure persistent release signing."
            exit 1
          fi
      - name: Build installable APK
        working-directory: safar-e-shahadat-2026-android
        run: gradle --no-daemon :app:assembleDebug -PappVersionCode=${{ github.run_number }}
      - name: Save original signing certificate cache
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: safar-shahadat-android-debug-signing-2026-v1
      - name: Publish APK for in-app updates
        run: |
          python - <<'PY'
          import json, pathlib, shutil, re, datetime
          root=pathlib.Path('safar-e-shahadat-2026-android')
          g=(root/'app/build.gradle').read_text()
          version=int(re.search(r'versionCode\s+(\d+)',g).group(1))
          apk=root/'app/build/outputs/apk/debug/app-debug.apk'
          out=pathlib.Path('poh-samagam/apk')
          out.mkdir(exist_ok=True,parents=True)
          name=f'Safar-e-Shahadat-2026-{version}.apk'
          shutil.copyfile(apk,out/name)
          data={'versionCode':version,'apkUrl':f'https://gamesplanet13.github.io/Gamesplanet_in/poh-samagam/apk/{name}',
                'publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('poh-samagam/app-update.json').write_text(json.dumps(data,indent=2)+'\n')
          print(data)
          PY
      - name: Publish APK and update manifest to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poh-samagam/apk/ poh-samagam/app-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Safar-e-Shahadat 2026 Android APK"
            git push
          fi
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Safar-e-Shahadat-2026-APK
          path: safar-e-shahadat-2026-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
