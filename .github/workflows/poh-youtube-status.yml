name: Refresh Poh Samagam YouTube Live Status
on:
  push:
    branches: [main]
    paths:
      - 'poh-samagam/update-youtube.py'
      - '.github/workflows/poh-youtube-status.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poh-youtube-status
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube extractor
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp
      - name: Check current stream and most recent completed livestream
        run: python poh-samagam/update-youtube.py
      - name: Commit live-status data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poh-samagam/youtube-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public YouTube live and recorded stream status"
            git push
          fi
