name: Import user's new Safar-e-Shahadat banner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/poh-new-banner-2026.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact user-supplied picture and optimize
        env:
          USER_BANNER: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/e9bd8d55-21cf-42bf-b85a-7eacc23dba3c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzJlZTliMzhjZDdmMDRmMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTY1MzMwNH0.x0R6Ilp19gHYYDVFWmtuFWtg9ccvpeBcbib-_-CdZuw'
        run: |
          set -eu
          mkdir -p poh-samagam/assets
          curl --location --fail --retry 3 --max-time 70 "$USER_BANNER" -o /tmp/user-safare-banner.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageFilter,ImageEnhance
          source=Image.open('/tmp/user-safare-banner.png').convert('RGB')
          assert source.width>=1200 and source.height>=600, source.size
          source.save('poh-samagam/assets/safare-2026-banner.webp', 'WEBP', quality=92, method=6)
          bg=source.resize((1280,720),Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(17))
          bg=ImageEnhance.Brightness(bg).enhance(1.09)
          bg.save('poh-samagam/assets/safare-2026-background.webp','WEBP',quality=77,method=6)
          print('Saved:',source.size)
          PY
      - name: Publish permanent artwork files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poh-samagam/assets/safare-2026-banner.webp poh-samagam/assets/safare-2026-background.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Publish user-supplied Safar-e-Shahadat new banner and blurred backdrop'
            git pull --rebase
            git push
          fi
