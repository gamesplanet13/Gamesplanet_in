name: Save Safar-e-Shahadat family faces artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/poh-original-faces-banner.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download reference-based banner
        env:
          ART_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/12287633-8aae-4442-8d64-a77e54e8d9af.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGVkMzM1OTI5YWE0NDk3YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTY3OTc2Mn0.1NGOQtQmrF1wjCzE1kAlARqMOxR35o8vXQA0M5OKiso'
        run: |
          set -eu
          curl --fail --location --retry 3 --max-time 60 "$ART_URL" -o /tmp/banner.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageFilter
          im=Image.open('/tmp/banner.png').convert('RGB')
          assert im.width>=1200,im.size
          im.save('poh-samagam/assets/safare-original-faces-2026.webp','WEBP',quality=93,method=6)
          bg=im.copy();bg.thumbnail((1360,900))
          bg=bg.filter(ImageFilter.GaussianBlur(18))
          bg.save('poh-samagam/assets/safare-original-faces-2026-blur.webp','WEBP',quality=76,method=6)
          PY
      - name: Commit artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poh-samagam/assets/safare-original-faces-2026.webp poh-samagam/assets/safare-original-faces-2026-blur.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Publish poster with family faces and clothing reference'
            git pull --rebase
            git push
          fi
