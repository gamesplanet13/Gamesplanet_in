plugins { id 'com.android.application' }
android {
    namespace 'in.gamesplanet.safareshahadat'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'in.gamesplanet.safareshahadat2026'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(project.findProperty('appVersionCode') ?: '1')
        versionName '1.0.' + (project.findProperty('appVersionCode') ?: '1')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
